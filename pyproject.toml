[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "session-broker"
version = "0.1.0"
description = "Local MCP tools so agents can sign into websites without seeing passwords."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Om Divyatej" }]
keywords = ["mcp", "agent", "playwright", "session", "cursor"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "playwright>=1.49",
  "mcp>=1.9",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/om-divyatej/session-broker"
Repository = "https://github.com/om-divyatej/session-broker"

[project.scripts]
session-broker = "session_broker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
